<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../shared/base.css">
<style>
  .main   { flex: 1; display: flex; gap: 14px; min-height: 0; }
  .left   { flex: 1.35; display: flex; flex-direction: column; justify-content: center; padding-left: 10px; }
  .greet  { font-size: 22px; color: var(--dim); }
  .hm     { font-size: 132px; font-weight: 800; line-height: 1; letter-spacing: -2px;
            background: linear-gradient(180deg, #ffffff, #9fb8ff);
            -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ss     { font-size: 40px; font-weight: 700; color: var(--cyan); margin-left: 6px; }
  .date   { font-size: 24px; margin-top: 10px; }
  .right  { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .right .card { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .quote  { font-size: 16px; color: var(--dim); text-align: center; padding: 10px 16px; }
  .accent-orange .bar > div { background: linear-gradient(90deg, var(--orange), var(--yellow)); }
  .accent-purple .bar > div { background: linear-gradient(90deg, var(--purple), var(--blue)); }
</style>
</head>
<body>
<div class="page">
  <div class="main">
    <div class="left">
      <div class="greet" id="greet"></div>
      <div><span class="hm" id="hm">--:--</span><span class="ss" id="ss">--</span></div>
      <div class="date" id="date"></div>
    </div>
    <div class="right">
      <div class="card accent-orange">
        <div class="label">距離下班 18:00</div>
        <div class="value" id="off">--</div>
        <div class="bar"><div id="offBar"></div></div>
      </div>
      <div class="card accent-purple">
        <div class="label">本週</div>
        <div class="value" id="week">--</div>
        <div class="bar"><div id="weekBar"></div></div>
      </div>
      <div class="card">
        <div class="label">今年</div>
        <div class="value" id="year">--</div>
        <div class="small" id="yearLeft"></div>
      </div>
    </div>
  </div>
  <div class="card quote" id="quote"></div>
</div>
<script>
  // ---- settings you might want to change ----
  const WORK_START = [9, 0];    // 上班
  const WORK_END   = [18, 0];   // 下班
  const QUOTES = [
    '先求有，再求好。',
    '能動的程式碼，就別在週五下午重構。',
    '今天的 bug，是明天的經驗值。',
    '休息是為了走更長的路。',
    '寫註解的你，是未來自己的恩人。',
    '一次只做一件事。',
    '別忘了喝水。',
  ];
  // -------------------------------------------

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const DAYS = ['日', '一', '二', '三', '四', '五', '六'];
  const at = (d, [h, m]) => { const x = new Date(d); x.setHours(h, m, 0, 0); return x; };

  function greet(h) {
    if (h < 5)  return '夜深了，早點休息';
    if (h < 11) return '早安';
    if (h < 14) return '午安';
    if (h < 18) return '下午好';
    return '晚安';
  }

  let lastMinute = -1;
  function tick() {
    const now = new Date();
    $('ss').textContent = pad(now.getSeconds());
    if (now.getMinutes() === lastMinute) return;   // the rest only changes once a minute
    lastMinute = now.getMinutes();

    $('hm').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    $('greet').textContent = greet(now.getHours());
    $('date').textContent = `${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日　星期${DAYS[now.getDay()]}`;

    // work day
    const start = at(now, WORK_START), end = at(now, WORK_END);
    const weekend = now.getDay() === 0 || now.getDay() === 6;
    let text, frac;
    if (weekend)          { text = '週末愉快'; frac = 1; }
    else if (now < start) { text = '還沒上班'; frac = 0; }
    else if (now >= end)  { text = '下班了！'; frac = 1; }
    else {
      const left = end - now;
      text = `${Math.floor(left / 3600000)} 小時 ${Math.floor(left / 60000) % 60} 分`;
      frac = (now - start) / (end - start);
    }
    $('off').textContent = text;
    $('offBar').style.width = `${frac * 100}%`;

    // week (Mon..Sun)
    const wd = (now.getDay() + 6) % 7;            // 0 = Monday
    $('week').textContent = `第 ${wd + 1} 天 / 7`;
    $('weekBar').style.width = `${(wd + now.getHours() / 24) / 7 * 100}%`;

    // year
    const y0 = new Date(now.getFullYear(), 0, 1), y1 = new Date(now.getFullYear() + 1, 0, 1);
    const day = Math.floor((now - y0) / 86400000) + 1;
    $('year').textContent = `第 ${day} 天`;
    $('yearLeft').textContent = `還有 ${Math.round((y1 - now) / 86400000)} 天到 ${now.getFullYear() + 1}`;

    $('quote').textContent = QUOTES[day % QUOTES.length];
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
